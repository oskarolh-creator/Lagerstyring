  isEditing: () =>

  onPasswordRecovery: () => newPasswordModal(true),
};
// Finner hvem som er logget inn ut fra Supabase-økten og dataene.
function customerUser(customer) {
  return {
    name: customer.name,
    email: customer.email,
    phone: customer.phone,
    address: customer.address,
    orgNumber: customer.orgNumber,
    accountType:
      customer.accountType ||
      (customer.businessId ? "business-employee" : "private"),
    businessName: customer.businessName || "",
    businessId: customer.businessId || "",
    owner: !!customer.owner,
    role: "customer",

      customer.accountType === "business"
        ? "Bedriftskonto"
        : customer.accountType === "business-employee"
          ? "Bedriftsansatt"

}
function sessionUser() {
  const email = (window.UtleieBackend?.session?.user?.email || "").toLowerCase();
  if (!email) return null;
  const employee =
    window.UtleieBackend.staffMode &&
    users.find(
      (u) =>
        (u.email || "").toLowerCase() === email && (u.state || "Aktiv") === "Aktiv",
    );
  if (employee)
    return {
      name: employee.name,
      email: employee.email,
      role: employee.role === "Administrator" ? "admin" : "staff",
      access: employee.role,
      canApproveInvoices:
        !!employee.canApproveInvoices || employee.role === "Administrator",
    };
  const customer = customers.find((c) => (c.email || "").toLowerCase() === email);
  return customer ? customerUser(customer) : null;
}
// Ekte tall til «Utleieaktivitet»: aktive ordre og utleide enheter per dag de siste 7 dagene.
function activityChart() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const date = localDateString(d);
    let count = 0,
      units = 0;
    orders.filter(activeOrder).forEach((o) => {
      const lines = orderItems(o).filter(
        (l) => l.from <= date && periodEnd(l.from, l.to) > date,
      );
      if (lines.length) count++;
      units += lines.reduce((n, l) => n + (+l.qty || 0), 0);
    });
    days.push({ label: ["Søn", "Man", "Tir", "Ons", "Tor", "Fre", "Lør"][d.getDay()], count, units });
  }
  const top = Math.max(4, ...days.map((d) => Math.max(d.count, d.units)));
  const step = Math.ceil(top / 3);
  const max = step * 3;
  const h = (v) => Math.round((v / max) * 96);
  return `<div class="chart-wrap"><div class="chart-y"><span>${max}</span><span>${step * 2}</span><span>${step}</span><span>0</span></div><div class="chart">${days
    .map(
      (d) =>
        `<div class="bar-group" title="${d.count} ordre · ${d.units} enheter"><div class="bar" style="height:${h(d.count)}px"></div><div class="bar accent" style="height:${h(d.units)}px"></div><span class="bar-label">${d.label}</span></div>`,
    )
    .join("")}</div></div>`;
}
function nextOrderNumber() {
  const nums = orders.map((o) => Number(String(o.id || "").match(/^ORD-(\d+)$/)?.[1] || 0));
  return "ORD-" + (Math.max(2049, ...nums) + 1);
}
function recordOrderEvent(order, action) {
  if (!currentUser || currentUser.role === "customer") return;
  order.events = order.events || [];
  order.events.push({
    action,
    actor: currentUser.name,
    actorEmail: currentUser.email,
    actorRole: currentUser.role,
    at: new Date().toISOString(),
  });
}
const esc = (s) =>
  String(s ?? "").replace(
    /[&<>"']/g,
    (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[
        c
      ],
  );
const productBy = (id) => products.find((p) => p.id === id);
const productIsActive = (p) => p?.active !== false;
const orderItems = (o) =>
  Array.isArray(o?.items) && o.items.length
    ? o.items
    : o?.itemId
      ? [
          {
            itemId: o.itemId,
            qty: o.qty,
            from: o.from,
            to: o.to,
            setup: o.setup,
            setupPrice: o.setupPrice,
            deliveryArea: o.deliveryArea,
            deliveryFee: o.deliveryFee,
            deliveryPriceRequest: o.deliveryPriceRequest,
            deliveryAddress: o.deliveryAddress,
            installArea: o.installArea,
            identifiers: o.identifiers,
          },
        ]
      : [];
const orderProductQuantity = (o, id) =>
  orderItems(o)
    .filter((i) => i.itemId === id)
    .reduce((n, i) => n + (+i.qty || 0), 0);
const allCategories = () =>
  [
    ...new Set(
      [...products.map((p) => p.category), ...extraCategories].filter(Boolean),
    ),
  ].sort((a, b) => a.localeCompare(b, "nb"));
const followupQuantity = (p) =>
  Math.max(
    0,
    Math.min(
      +p?.quantity || 0,
      p?.condition === "service"
        ? +p.quantity || 0
        : p?.followupQty != null
          ? Number(p.followupQty)
          : p?.condition === "unavailable"
            ? +p.quantity || 0
            : 0,
    ),
  );
const followupStatusLabel = (status) =>
  followupStatuses.find((item) => item.value === status)?.label ||
  String(status || "Trenger oppfølging");
const productVatRate = (p) =>
  Math.max(0, Math.min(100, Number(p?.vatRate ?? 25)));
const withProductVat = (p, amount) => amount * (1 + productVatRate(p) / 100);
const activeOrder = (o) =>
  !["Returnert", "Avbestilt", "Forespørsel"].includes(o.status);
const discountAccount = (account) =>
  account?.accountType === "business-employee"
    ? customers.find(
        (c) =>
          c.accountType === "business" && c.businessId === account.businessId,
      ) || account
    : account;
function discountPercentFor(account, p) {
  const a = discountAccount(account),
    d = a?.discounts || {},
    all = a?.discountAll ?? a?.discountPercent ?? d.all ?? d.allProducts ?? 0,
    categories =
      a?.categoryDiscounts ||
      a?.discountByCategory ||
      d.categories ||
      d.byCategory ||
      {},
    productsById =
      a?.productDiscounts ||
      a?.discountByProduct ||
      d.products ||
      d.byProduct ||
      {},
    value = productsById[p?.id] ?? categories[p?.category] ?? all;
  return Math.max(0, Math.min(100, Number(value) || 0));
}
function rentalBillingEnd(item, order) {
  if (order?.status === "Returnert") return order.returnedAt || item.to;
  const today = localDateString();
  return ["Utlevert", "Hentet", "Levert"].includes(order?.status) &&
    today > item.to
    ? today
    : item.to;
}
function rentalDayCount(from, to) {
  if (!from || !to) return 0;
  const start = new Date(from + "T12:00:00"),
    end = new Date(to + "T12:00:00");
  return Math.max(1, Math.round((end - start) / 86400000) || 1);
}
function rentalSubtotal(p, from, to, qty = 1) {
  if (!p || !from || !to) return 0;
  const start = new Date(from + "T12:00:00"),
    days = rentalDayCount(from, to);
  let total = 0;
  for (let index = 0; index < days; index++) {
    const date = new Date(start);
    date.setDate(date.getDate() + index);
    const weekend = date.getDay() === 0 || date.getDay() === 6;
    total += Number(
      weekend ? (p.weekendPrice ?? p.price ?? 0) : (p.price ?? 0),
    );
  }
  return total * (Number(qty) || 0);
}
function orderLineGross(item, order) {
  const p = productBy(item?.itemId),
    from = item?.from || order?.from,
    to = rentalBillingEnd({ ...item, to: item?.to || order?.to }, order),
    start = new Date(from + "T12:00:00"),
    days = rentalDayCount(from, to);
  let rental = 0;
  for (let index = 0; index < days; index++) {
    const date = new Date(start);
    date.setDate(date.getDate() + index);
    const weekend = date.getDay() === 0 || date.getDay() === 6;
    rental += Number(
      weekend ? (p?.weekendPrice ?? p?.price ?? 0) : (p?.price ?? 0),
    );
  }
  const qty = +item?.qty || +order?.qty || 0,
    insuranceEnabled = item?.insuranceEnabled ?? p?.insuranceEnabled,
    insurancePercent = Number(
      item?.insurancePercent ?? p?.insurancePercent ?? 0,
    ),
    insurance = insuranceEnabled ? (rental * insurancePercent) / 100 : 0;
  return (
    rental * qty +
    insurance * qty +
    Number(item?.setup ? (item.setupPrice ?? p?.setupPrice ?? 0) : 0) +
    Number(item?.deliveryFee || 0)
  );
}
function orderGrossTotal(order) {
  return orderItems(order).reduce(
    (sum, item) => sum + orderLineGross(item, order),
    0,
  );
}
function orderDiscount(order) {
  const gross = orderGrossTotal(order),
    amount =
      order?.discountAmount != null
        ? Number(order.discountAmount)
        : (gross * Number(order?.discountPercent || 0)) / 100;
  return Math.max(0, Math.min(gross, Math.round(amount || 0)));
}
function orderTotal(order) {
  return Math.max(0, orderGrossTotal(order) - orderDiscount(order));
}
function createOrderDiscount(order, account) {
  const lines = orderItems(order),
    gross = lines.reduce((sum, item) => sum + orderLineGross(item, order), 0);
  if (!account) {
    order.discountAmount = order.discountPercent
      ? Math.round((gross * Number(order.discountPercent)) / 100)
      : 0;
    return;
  }
  const discount = lines.reduce(
    (sum, item) =>
      sum +
      (orderLineGross(item, order) *
        discountPercentFor(account, productBy(item.itemId))) /
        100,
    0,
  );
  order.discountAmount = Math.max(0, Math.min(gross, Math.round(discount)));
  order.discountPercent = gross
    ? Math.round((order.discountAmount / gross) * 10000) / 100
    : 0;
}
function extraRentalDays(order) {
  return Math.max(
    0,

const dayAfter = (date) => {

  return localDateString(d);
};
const periodEnd = (from, to) => (to > from ? to : dayAfter(from));
function availableForPeriod(p, from, to) {
  if (!p || !productIsActive(p) || !from || !to) return 0;
  const start = from,
    end = periodEnd(from, to);
  if (p.availableFrom && start < p.availableFrom) return 0;
  if (
    ["unavailable", "rented"].includes(p.condition) &&
    (!p.availableFrom || start < p.availableFrom)
  )
    return 0;
  let maxHeld = 0;
  for (let date = start; date < end; date = dayAfter(date)) {
    const held = orders.filter(activeOrder).reduce(
      (sum, o) =>
        sum +
        orderItems(o)
          .filter(
            (i) =>
              i.itemId === p.id &&
              i.from <= date &&
              periodEnd(i.from, i.to) > date,
          )
          .reduce((n, i) => n + (+i.qty || 0), 0),
      0,
    );
    maxHeld = Math.max(maxHeld, held);
  }
  return Math.max(
    0,
    (+p.quantity || 0) -
      (p.condition === "service" ? +p.quantity || 0 : followupQuantity(p)) -
      maxHeld,

}

function statusTag(text) {
  const cls = [
    "Utlevert",
    "Hentet",
    "Levert",
    "Klargjøres",
    "Forespørsel",
    "Til godkjenning",
  ].includes(text)
    ? "amber"
    : ["Service", "Avbestilt", "Forfalt"].includes(text)
      ? "red"

function availableTag(p) {
  const followup = followupQuantity(p);
  if (!productIsActive(p)) return statusTag("Midlertidig deaktivert");
  if (p.condition === "service") return statusTag("På service");
  const today = localDateString();
  if (p.availableFrom && p.availableFrom > today)
    return statusTag("Tilgjengelig fra " + dayFmt(p.availableFrom));
  if (
    ["unavailable", "rented"].includes(p.condition) &&
    (!p.availableFrom || p.availableFrom > today)
  )
    return statusTag(p.condition === "rented" ? "Utleid" : "Utilgjengelig");
  const a = available(p);
  if (followup > 0) return statusTag("Oppfølging: " + followup + " stk");
  if (a === 0) return statusTag("Utleid");
  if (a < p.quantity) return statusTag("Delvis utleid");
  return statusTag("Tilgjengelig");
}

function editOrderIdentifiers(orderId, index) {

  const o = orders.find((x) => x.id === orderId),
    items = o && orderItems(o),
    line = items?.[index],
    p = line && productBy(line.itemId);
  if (!o || !line || !p?.identifierLabel) return;
  modal(
    '<div class="modal-head"><div><h2 id="modalTitle">' +
      esc(p.identifierLabel) +
      " · " +
      esc(p.name) +
      "</h2><p>Ordre " +
      esc(o.id) +
      ' · ett kjennetegn per enhet</p></div><button class="close" onclick="closeModal()">×</button></div><form id="orderIdentifierForm"><div class="modal-body"><div class="field"><label>' +
      esc(p.identifierLabel) +

  );

    e.preventDefault();
    const ids = String(new FormData(e.target).get("identifiers") || "")
      .split(/[\n,;]+/)

      .filter(Boolean);
    if (ids.length !== Number(line.qty)) {

      return;

function updateOrderStatus(id, next) {
  const o = orders.find((x) => x.id === id);
  if (!o || o.status === next) return;
  if (next === "Returnert") {
    returnOrder(id);
    return;
  }
  if (o.status === "Returnert") {
    undoReturn(id);
  }
  o.status = next;
  recordOrderEvent(o, "status:" + next);
  save();
  closeModal();
  render();
  showToast("Ordrestatusen er endret til " + next);
}
function addItemsToOrder(id) {
  const o = orders.find((x) => x.id === id);
  if (!o) return;
  if (["Returnert", "Avbestilt"].includes(o.status)) {
    showToast("Du kan ikke legge varer til en avsluttet ordre");
    return;
  }
  const options = products
      .filter((p) => productIsActive(p) && p.quantity > 0)
      .sort(
        (a, b) =>
          a.category.localeCompare(b.category, "nb") ||
          a.name.localeCompare(b.name, "nb"),
      ),
    today = localDateString(),
    categories = [...new Set(options.map((p) => p.category))].sort((a, b) =>
      a.localeCompare(b, "nb"),
    ),
    category = categories[0] || "",
    categoryOptions = categories
      .map((c) => "<option>" + esc(c) + "</option>")
      .join(""),
    initial = options.filter((p) => p.category === category);
  modal(
    '<div class="modal-head"><div><h2 id="modalTitle">Legg varer til ordre ' +
      esc(o.id) +
      '</h2><p>Velg en ekstra vare og angi egne datoer for den.</p></div><button class="close" onclick="closeModal()">×</button></div><form id="addOrderItemForm"><div class="modal-body"><div class="form-grid"><div class="field"><label>Kategori</label><select name="category">' +
      categoryOptions +
      '</select></div><div class="field"><label>Produkt</label><select name="itemId">' +
      initial
        .map(
          (p) =>
            '<option value="' +
            esc(p.id) +
            '">' +
            esc(p.name) +
            " · " +
            available(p) +
            " tilgjengelig</option>",
        )
        .join("") +
      '</select></div><div class="field"><label>Antall</label><input name="qty" type="number" min="1" value="1" required></div><div class="field"><label>Fra dato</label><input name="from" type="date" value="' +
      today +
      '" required></div><div class="field"><label>Til dato</label><input name="to" type="date" value="' +
      today +
      '" required></div><div class="field full hidden" id="extraIdentifierBox"><label id="extraIdentifierLabel">Kjennetegn</label><textarea name="identifiers"></textarea></div><div class="field full hidden" id="extraSetupBox"><label class="switch-line"><input type="checkbox" name="setup"> Legg til montering/oppsett</label></div><div class="field full"><small id="extraItemAvailability"></small></div></div></div><div class="modal-foot"><button type="button" class="secondary" onclick="closeModal()">Avbryt</button><button class="primary">Legg til vare</button></div></form>',
  );
  const form = document.getElementById("addOrderItemForm"),
    categoryInput = form.elements.category,
    select = form.elements.itemId,
    availability = document.getElementById("extraItemAvailability");
  const fill = () => {
    const matches = options
      .filter((p) => p.category === categoryInput.value)
      .sort((a, b) => a.name.localeCompare(b.name, "nb"));
    select.innerHTML =
      matches
        .map(
          (p) =>
            '<option value="' +
            esc(p.id) +
            '">' +
            esc(p.name) +
            " · " +
            available(p) +
            " tilgjengelig</option>",
        )
        .join("") || '<option value="">Ingen produkter</option>';
    refresh();
  };
  const refresh = () => {
    const p = productBy(select.value),
      idBox = document.getElementById("extraIdentifierBox"),
      setupBox = document.getElementById("extraSetupBox"),
      idLabel = document.getElementById("extraIdentifierLabel"),
      from = form.elements.from.value,
      to = form.elements.to.value;
    if (idBox) {
      idBox.classList.toggle("hidden", !p?.identifierLabel);
      if (idLabel) idLabel.textContent = p?.identifierLabel || "Kjennetegn";
      form.elements.identifiers.required = !!p?.identifierLabel;
    }
    if (setupBox) setupBox.classList.toggle("hidden", !p?.setupAvailable);
    const own = orderItems(o)
        .filter(
          (i) =>
            i.itemId === p?.id &&
            i.from < periodEnd(from, to) &&
            from < periodEnd(i.from, i.to),
        )
        .reduce((n, i) => n + (+i.qty || 0), 0),
      count = availableForPeriod(p, from, to) + own;
    if (availability)
      availability.textContent =
        "Tilgjengelig i valgt periode: " + count + " stk.";
  };
  form.onchange = (e) => {
    if (e.target.name === "category") fill();
    refresh();
  };
  form.oninput = refresh;
  fill();
  form.onsubmit = (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(form)),
      p = productBy(d.itemId);
    if (!p) return;
    if (d.to < d.from) {
      showToast("Til-dato må være samme dag eller etter fra-dato");
      return;
    }
    const own = orderItems(o)
        .filter(
          (i) =>
            i.itemId === p.id &&
            i.from < periodEnd(d.from, d.to) &&
            d.from < periodEnd(i.from, i.to),
        )
        .reduce((n, i) => n + (+i.qty || 0), 0),
      availableCount = availableForPeriod(p, d.from, d.to) + own;
    if (Number(d.qty) > availableCount) {
      showToast("Kun " + availableCount + " stk tilgjengelig i perioden");
      return;
    }
    const identifiers = String(d.identifiers || "")
      .split(/[\n,;]+/)
      .map((x) => x.trim())
      .filter(Boolean);
    if (p.identifierLabel && identifiers.length !== Number(d.qty)) {
      showToast(
        "Legg inn ett " +
          p.identifierLabel.toLocaleLowerCase("nb") +
          " per enhet",
      );
      return;
    }
    const line = {
      itemId: p.id,
      itemName: p.name,
      category: p.category,
      qty: Number(d.qty),
      from: d.from,
      to: d.to,
      setup: d.setup === "on" && !!p.setupAvailable,
      setupPrice: d.setup === "on" ? Number(p.setupPrice || 0) : 0,
      deliveryFee: 0,
      deliveryPriceRequest: false,
      identifiers,
      vatRate: productVatRate(p),
      insuranceEnabled: !!p.insuranceEnabled,
      insurancePercent: Number(p.insurancePercent || 0),
    };
    o.items = orderItems(o).map((i) => ({ ...i }));
    o.items.push(line);
    createOrderDiscount(
      o,
      discountAccount(customers.find((c) => c.email === o.customerEmail)),
    );
    recordOrderEvent(o, "itemsAdded");
    save();
    closeModal();
    render();
    showToast("Varen ble lagt til i ordren");
  };
}

function addScannedToCart(id) {
  if (role === "customer") {
    showToast("Logg inn som ansatt for å bruke lagerhandlekurven");
    return;
  }
  const p = productBy(id);
  if (!p) return;
  const today = localDateString(),
    end = dayAfter(today),
    used = cartDraft
      .filter(
        (i) =>
          i.itemId === id && i.from < end && today < periodEnd(i.from, i.to),
      )
      .reduce((sum, i) => sum + (Number(i.qty) || 0), 0),
    remaining = availableForPeriod(p, today, end) - used;
  if (remaining < 1) {
    showToast("Ingen ledige enheter å legge i handlekurven");
    return;
  }
  const existing = cartDraft.find(
    (i) => i.itemId === id && i.from === today && i.to === today,
  );
  if (existing)
    existing.qty = Math.min(
      remaining + Number(existing.qty || 0),
      Number(existing.qty || 0) + 1,
    );
  else
    cartDraft.push({
      itemId: p.id,
      itemName: p.name,
      category: p.category,
      qty: 1,
      from: today,
      to: today,
      setup: false,
      setupPrice: 0,
      deliveryFee: 0,
      deliveryPriceRequest: false,
      deliveryAddress: "",
      installArea: "",
      identifiers: [],
      vatRate: productVatRate(p),
      insuranceEnabled: !!p.insuranceEnabled,
      insurancePercent: Number(p.insurancePercent || 0),
    });
  save();
  showToast(p.name + " lagt i handlekurven");
}

function addCartToExistingOrder(cartId) {
  const lines =
    cartId === "draft"
      ? cartDraft
      : rentalCarts.find((item) => item.id === cartId)?.items;
  if (!lines?.length) {
    showToast("Handlekurven er tom");
    return;
  }
  const active = orders.filter(
    (o) => !["Returnert", "Avbestilt"].includes(o.status),
  );
  if (!active.length) {
    showToast("Opprett en ordre før du legger til handlekurv");
    return;
  }
  modal(
    '<div class="modal-head"><div><h2 id="modalTitle">Legg handlekurv til ordre</h2><p>Velg en pågående ordre som skal få varene.</p></div><button class="close" onclick="closeModal()">×</button></div><form id="attachCartForm"><div class="modal-body"><div class="field"><label>Ordre</label><select name="orderId" required>' +
      active
        .map(
          (o) =>
            '<option value="' +
            esc(o.id) +
            '">' +
            esc(o.id) +
            " · " +
            esc(o.businessName || o.customer) +
            " · " +
            esc(o.status) +
            "</option>",
        )
        .join("") +
      '</select></div><div class="small-note">Varene beholder antall, leiedatoer, levering og montering fra handlekurven.</div><div id="attachCartError" class="small-note" style="color:#b3483c;font-weight:700"></div></div><div class="modal-foot"><button type="button" class="secondary" onclick="closeModal()">Avbryt</button><button class="primary">Legg til varer</button></div></form>',
  );
  document.getElementById("attachCartForm").onsubmit = (e) => {
    e.preventDefault();
    const order = orders.find(
        (o) => o.id === new FormData(e.target).get("orderId"),
      ),
      error = document.getElementById("attachCartError");
    if (!order) return;
    const existing = orderItems(order),
      planned = [];
    for (const line of lines) {
      const p = productBy(line.itemId);
      if (!p) {
        error.textContent = "Et produkt i handlekurven finnes ikke lenger.";
        return;
      }
      if (
        p.identifierLabel &&
        (line.identifiers || []).length !== Number(line.qty)
      ) {
        error.textContent =
          "Legg inn " +
          line.qty +
          " " +
          p.identifierLabel +
          " for " +
          p.name +
          " i handlekurven.";
        return;
      }
      if (!line.from || !line.to || line.to < line.from) {
        error.textContent = "Kontroller leiedatoene for " + p.name + ".";
        return;
      }
      if (
        ["unavailable", "rented"].includes(p.condition) &&
        (!p.availableFrom || line.from < p.availableFrom)
      ) {
        error.textContent =
          p.name + " er ikke tilgjengelig i den valgte perioden.";
        return;
      }
      for (
        let date = line.from;
        date < periodEnd(line.from, line.to);
        date = dayAfter(date)
      ) {
        const held = orders
            .filter((other) => other !== order && activeOrder(other))
            .reduce(
              (sum, other) =>
                sum +
                orderItems(other)
                  .filter(
                    (i) =>
                      i.itemId === p.id &&
                      i.from <= date &&
                      periodEnd(i.from, i.to) > date,
                  )
                  .reduce((n, i) => n + (Number(i.qty) || 0), 0),
              0,
            ),
          own = existing
            .filter(
              (i) =>
                i.itemId === p.id &&
                i.from <= date &&
                periodEnd(i.from, i.to) > date,
            )
            .reduce((n, i) => n + (Number(i.qty) || 0), 0),
          added = planned
            .filter(
              (i) =>
                i.itemId === p.id &&
                i.from <= date &&
                periodEnd(i.from, i.to) > date,
            )
            .reduce((n, i) => n + (Number(i.qty) || 0), 0),
          capacity = Math.max(
            0,
            (Number(p.quantity) || 0) -
              (p.condition === "service"
                ? Number(p.quantity) || 0
                : followupQuantity(p)),
          );
        if (held + own + added + Number(line.qty) > capacity) {
          error.textContent =
            "Ikke nok ledig lager av " +
            p.name +
            " i perioden " +
            dayFmt(line.from) +
            "–" +
            dayFmt(line.to) +
            ".";
          return;
        }
      }
      planned.push({ ...line });
    }
    order.items = existing.map((i) => ({ ...i })).concat(planned);
    order.deliveryPriceRequest = order.items.some(
      (i) => i.deliveryPriceRequest,
    );
    createOrderDiscount(
      order,
      customers.find((c) => c.email === order.customerEmail),
    );
    recordOrderEvent(order, "itemsAdded");
    if (cartId === "draft") cartDraft = [];
    save();
    closeModal();
    render();
    showToast("Handlekurven er lagt til ordre " + order.id);
  };
}

function updateProductGallery(index) {

    count.textContent = productGalleryState.index + 1 + " / " + images.length;

    .forEach((dot, i) =>

function applyThemePreset(name) {
  const presets = {
    custom: null,
    forest: {
      primary: "#286b4b",
      accent: "#c6df83",
      canvas: "#f3f5ed",
      surface: "#ffffff",
      textColor: "#202820",
    },
    ocean: {
      primary: "#176b7a",
      accent: "#7dd3cf",
      canvas: "#edf6f7",
      surface: "#ffffff",
      textColor: "#18343a",
    },
    sunset: {
      primary: "#a94e38",
      accent: "#f2ba76",
      canvas: "#fbf2e9",
      surface: "#fffaf5",
      textColor: "#382821",
    },
    midnight: {
      primary: "#9acb98",
      accent: "#d3a8f3",
      canvas: "#202624",
      surface: "#2d3430",
      textColor: "#f2f4ef",
    },
  };
  const preset = presets[name];
  if (!preset) return;
  const form = document.getElementById("siteSettingsForm");
  Object.entries(preset).forEach(([key, value]) => {
    const input = form?.elements.namedItem(key);
    if (input) input.value = value;
    siteSettings[key] = value;
  });
  siteSettings.theme = name;
  updateHeader();
}
function readImageFile(file) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith("image/")) {
      reject(new Error("Velg en bildefil."));
      return;
    }
    if (file.size > 700 * 1024) {
      reject(new Error("Bildet må være mindre enn 700 KB."));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Bildet kunne ikke leses."));
    reader.readAsDataURL(file);
  });
}
async function uploadHero(input) {

}

function parseDeliveryRates(value) {
  return String(value || "")
    .split(/\r?\n/)
    .map((line) => line.trim())
    .filter(Boolean)
    .map((line) => {
      const split = line.lastIndexOf("|");
      if (split < 1) return null;
      const area = line.slice(0, split).trim(),
        price = Number(line.slice(split + 1).trim());
      return area && Number.isFinite(price) && price >= 0
        ? { area, price }
        : null;
    })
    .filter(Boolean);
}

function deleteProduct(id) {
  if (role !== "admin") {
    showToast("Administratorrolle kreves");
    return;
  }
  const p = productBy(id);
  if (!p) return;
  const inOrders = orders.some((o) =>
    orderItems(o).some((i) => i.itemId === id),
  );
  if (inOrders) {
    if (
      !confirm(
        "Produktet finnes i ordrehistorikken. Deaktiver det i stedet for å slette historikken?",
      )
    )
      return;
    p.active = false;
    save();
    closeModal();
    render();
    showToast("Produktet er deaktivert og skjult fra nye bestillinger");
    return;
  }
  if (!confirm("Slette " + p.name + " permanent?")) return;
  products = products.filter((x) => x.id !== id);
  save();
  closeModal();
  render();
  showToast("Produktet er slettet");
}
function deleteCategory(name) {
  if (role !== "admin") {
    showToast("Administratorrolle kreves");
    return;
  }
  if (
    !confirm(
      "Slette kategorien «" +
        name +
        "»? Produktene flyttes til «Ukategorisert».",
    )
  )
    return;
  products.forEach((p) => {
    if (p.category === name) p.category = "Ukategorisert";
  });
  extraCategories = extraCategories.filter((c) => c !== name);
  if (selectedCategory === name) selectedCategory = "";
  save();
  render();
  showToast("Kategorien er slettet");
}

  openProductModal(id);

function returnOrder(id) {
  const o = orders.find((x) => x.id === id);
  if (!o || o.status === "Returnert") return;
  const beforeStatus = o.status,
    lines = orderItems(o),
    grouped = {};
  lines.forEach((i) => {
    const g =
      grouped[i.itemId] || (grouped[i.itemId] = { qty: 0, identifiers: [] });
    g.qty += +i.qty || 0;
    g.identifiers.push(...(i.identifiers || []));
  });
  o.previousProductStates = {};
  o.previousOrderStatus = beforeStatus;
  o.status = "Returnert";
  o.returnedAt = localDateString();
  o.returnedBy = currentUser?.name || "";
  Object.entries(grouped).forEach(([id, line]) => {
    const p = productBy(id);
    if (!p) return;
    o.previousProductStates[id] = {
      condition: p.condition,
      followupQty: p.followupQty ?? null,
      followupStatus: p.followupStatus ?? null,
      followupReason: p.followupReason ?? null,
      followupAssets: Array.isArray(p.followupAssets)
        ? p.followupAssets.slice()
        : null,
    };
    if (p.returnDisposition === "followup") {
      p.followupQty = Math.min(
        +p.quantity || 0,
        followupQuantity(p) + line.qty,
      );
      p.followupStatus = p.followupStatus || "service";
      p.followupReason = p.followupReason || followupReasons[0] || "";
      if (line.identifiers.length) {
        const assets = [
          ...(p.followupAssets || []),
          ...line.identifiers.map((identifier) => ({
            identifier,
            orderId: o.id,
            customer: o.customer,
            reason: p.followupReason,
            status: p.followupStatus,
          })),
        ];
        p.followupAssets = assets.slice(-p.followupQty);
      }
      if (p.followupQty >= (+p.quantity || 0) && p.followupStatus === "service")
        p.condition = "service";
      else if (["service", "unavailable"].includes(p.condition))
        p.condition = "available";
    } else if (
      !orders.some(
        (x) => x !== o && activeOrder(x) && orderProductQuantity(x, id) > 0,
      )
    )
      p.condition = "available";
  });
  recordOrderEvent(o, "received");
  save();
  render();
  showToast(
    "Retur registrert" +
      (Object.values(grouped).some(
        (g) =>
          productBy(Object.keys(grouped).find((id) => grouped[id] === g))
            ?.returnDisposition === "followup",
      )
        ? " og sendt til oppfølging"
        : ""),
  );
}
function undoReturn(id) {
  const o = orders.find((x) => x.id === id);
  if (!o || o.status !== "Returnert") return;
  Object.entries(o.previousProductStates || {}).forEach(([id, state]) => {
    const p = productBy(id);
    if (!p) return;
    p.condition = state.condition;
    if (state.followupQty == null) delete p.followupQty;
    else p.followupQty = state.followupQty;
    if (state.followupStatus == null) delete p.followupStatus;
    else p.followupStatus = state.followupStatus;
    if (state.followupReason == null) delete p.followupReason;
    else p.followupReason = state.followupReason;
    if (state.followupAssets == null) delete p.followupAssets;
    else p.followupAssets = state.followupAssets;
  });
  if (!o.previousProductStates) {
    const p = productBy(o.itemId);
    if (p) {
      if (o.previousFollowupQty == null) delete p.followupQty;
      else p.followupQty = o.previousFollowupQty;
      if (o.previousProductCondition != null)
        p.condition = o.previousProductCondition;
    }
  }
  o.status = o.previousOrderStatus || "Utlevert";
  delete o.returnedAt;
  delete o.returnedBy;
  delete o.previousProductStates;
  delete o.previousOrderStatus;
  delete o.previousFollowupQty;
  delete o.previousProductCondition;
  delete o.previousFollowupStatus;
  delete o.previousFollowupReason;
  recordOrderEvent(o, "returnUndone");
  save();
  render();
  showToast("Returen er angret, og ordren er satt tilbake som utlevert");
}

function dispatchOrder(id) {

function acceptInquiry(id) {
  const o = orders.find((x) => x.id === id);
  if (!o) return;
  const lines = orderItems(o);
  for (const line of lines) {
    const p = productBy(line.itemId);
    if (!p) continue;
    const competing = lines
        .filter(
          (other) =>
            other !== line &&
            other.itemId === line.itemId &&
            other.from < periodEnd(line.from, line.to) &&
            line.from < periodEnd(other.from, other.to),
        )
        .reduce((sum, other) => sum + (+other.qty || 0), 0),
      availableCount = availableForPeriod(p, line.from, line.to);
    if (+line.qty > availableCount - competing) {
      showToast("Ikke nok " + p.name + " tilgjengelig i valgt periode");
      return;
    }
  }
  o.status = "Reservert";
  recordOrderEvent(o, "approved");
  save();
  render();
  showToast("Forespørselen er godkjent og utstyret reservert");
}

function invoiceTaxGroups(o) {
  const gross = orderGrossTotal(o),
    discount = orderDiscount(o),
    ratio = gross ? Math.max(0, (gross - discount) / gross) : 1,
    groups = {};
  for (const i of orderItems(o)) {
    const p = productBy(i.itemId),
      rate = Number(o.vatRate ?? i.vatRate ?? productVatRate(p)),
      base = orderLineGross(i, o) * ratio;
    groups[rate] = (groups[rate] || 0) + base;
  }
  return Object.entries(groups).map(([rate, base]) => ({

  for (let i = 0; i < 8; i++) set(20 - i, 8, bit(i));
  for (let i = 8; i < 15; i++) set(8, 21 - 15 + i, bit(i));
  set(8, 13, true);

  codewords.forEach((b) => {
    for (let i = 7; i >= 0; i--) stream.push((b >>> i) & 1);
  });

    up = true;
  for (let right = 20; right >= 1; right -= 2) {
    if (right === 6) right--;
    for (let vert = 0; vert < 21; vert++) {
      const y = up ? 20 - vert : vert;
      for (let j = 0; j < 2; j++) {
        const x = right - j;
        if (!reserved[y][x]) {
          const raw = stream[k++] || 0;
          matrix[y][x] = !!(raw ^ ((x + y) % 2 === 0 ? 1 : 0));
        }
      }
    }
    up = !up;
  }
  let path = "";
  for (let y = 0; y < 21; y++)
    for (let x = 0; x < 21; x++) if (matrix[y][x]) path += `M${x},${y}h1v1h-1z`;

function startScanner() {
  const box = document.getElementById("cameraBox"),
    video = document.getElementById("cameraVideo");
  if (!navigator.mediaDevices?.getUserMedia) {
    showToast("Kamera er ikke tilgjengelig. Bruk skannefeltet under.");
    return;
  }
  if (!("BarcodeDetector" in window)) {
    showToast(
      "Kameraavlesning støttes ikke i denne nettleseren. Bruk USB-skanner eller skriv inn ID.",
    );
    return;
  }
  navigator.mediaDevices
    .getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false,
    })
    .then((stream) => {
      scannerStream = stream;
      video.srcObject = stream;
      video.play();
      box.classList.add("live");
      document.getElementById("cameraOverlay").innerHTML =
        '<div class="scan-mark"><svg viewBox="0 0 40 40"><path d="M4 13V5a1 1 0 0 1 1-1h8M27 4h8a1 1 0 0 1 1 1v8M36 27v8a1 1 0 0 1-1 1h-8M13 36H5a1 1 0 0 1-1-1v-8"/></svg></div><h3>Skanner aktiv</h3><p>Hold QR-koden innenfor rammen.</p><button class="secondary" onclick="stopScanner()">Stopp kamera</button>';
      const detector = new BarcodeDetector({
        formats: ["qr_code", "code_128", "ean_13"],
      });
      const loop = async () => {
        if (!scannerStream) return;
        try {
          const codes = await detector.detect(video);
          if (codes.length) {
            const field = document.getElementById("scanInput");
            if (field) {
              field.value = codes[0].rawValue;
              findScanned(field.value);
            }
            stopScanner();
            return;
          }
        } catch {}
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    })
    .catch(() =>
      showToast(
        "Kameratilgang ble ikke gitt. Du kan skrive eller skanne inn ID manuelt.",
      ),
    );
}
function stopScanner() {
  if (scannerStream) {
    scannerStream.getTracks().forEach((t) => t.stop());
    scannerStream = null;
  }
  const b = document.getElementById("cameraBox");
  if (b) {
    b.classList.remove("live");
    const video = document.getElementById("cameraVideo");
    if (video) video.srcObject = null;
    const overlay = document.getElementById("cameraOverlay");
    if (overlay)

});
document.addEventListener("click", (e) => {
  if (e.target.closest(".brand")) {
    e.preventDefault();
    go("dashboard");
  }
});
// Oppstart: hent økt og data fra Supabase før siden tegnes.
(async () => {
  document.getElementById("page").innerHTML =
    '<div class="small-note" style="padding:40px;text-align:center">Laster …</div>';
  try {
    backendHooks.set(await UtleieBackend.boot(backendHooks));
  } catch (err) {
    console.error(err);
    document.getElementById("page").innerHTML =
      '<div class="card" style="padding:24px;margin:40px auto;max-width:560px"><h2>Siden kunne ikke lastes</h2><p>' +
      esc(err.message || err) +
      "</p></div>";
    return;
  }
  const user = sessionUser();
  if (user) {
    currentUser = user;
    role = user.role;
    publicMode = role === "customer";
    view = publicMode ? "catalog" : "dashboard";
  }
  render();
  if (UtleieBackend.recovery) newPasswordModal(true);
  else if (
    currentUser?.role === "customer" &&
    customers.find((c) => c.email === currentUser.email)?.mustChangePassword
  ) {
    forcePasswordChangeModal();
  }
})();
</script>
</body>
</html>
